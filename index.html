<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f7f4ee">
    <meta name="description" content="Sinal — o que saiu no mundo da IA, já com um veredicto.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icone.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icone.svg">
    <title>Sinal</title>
    <script>
      // Aplica o tema guardado antes de a página pintar. Se esperasse pelo
      // app.js, quem escolheu o escuro via um relâmpago de branco a cada visita.
      try {
        var tema = localStorage.getItem("sinal-tema");
        if (tema === "claro" || tema === "escuro") document.documentElement.dataset.tema = tema;
      } catch (erro) {}
    </script>
    <link rel="stylesheet" href="estilo.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="saltar" href="#conteudo">Saltar para o conteúdo</a>

    <header class="cabecalho">
      <div class="pagina cabecalho__linha">
        <a class="marca" href="#/">Sinal</a>
        <p id="data-recolha" class="cabecalho__data"></p>
        <button id="alternar-tema" class="botao-texto" type="button">Escuro</button>
      </div>
      <nav class="pagina seccoes" aria-label="Secções">
        <a href="#/" data-vista="para-ti">Para ti</a>
        <a href="#/tudo" data-vista="tudo">Tudo</a>
      </nav>
    </header>

    <!-- O conteúdo é todo desenhado pelo app.js a partir de dados/itens.json.
         O que está aqui é só o estado de "a carregar", para não haver um ecrã
         em branco enquanto o ficheiro chega. -->
    <main id="conteudo" class="pagina" tabindex="-1">
      <div class="estado" role="status">
        <p class="estado__titulo">A ler a recolha…</p>
      </div>
      <noscript>
        <div class="estado">
          <p class="estado__titulo">O Sinal precisa de JavaScript.</p>
          <p>A página é desenhada no browser a partir de um ficheiro de dados. Liga o JavaScript e recarrega.</p>
        </div>
      </noscript>
    </main>

    <footer class="pagina rodape">
      <p>Sinal · uma leitura pessoal do mundo da IA, recolhida uma vez por dia.</p>
    </footer>
  </body>
</html>
