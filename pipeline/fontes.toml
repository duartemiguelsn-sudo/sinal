url = "https://www.reddit.com/r/LocalLLaMA/.rss"
camada = 2
limite = 25
confirmada = "2026-09-20"

# Carreira, o mais perto que há de graça. É a categoria do blogue do GitHub
# sobre o ofício: o papel do programador, primeiros passos, o que se pede hoje.
# Fica em camada 2 de propósito, apesar de ser o GitHub a escrever — é opinião,
# é global, e não é o mercado português nem é facto que se verifique.
[[fonte]]
nome = "GitHub — ofício de programador"
url = "https://github.blog/category/developer-skills/feed/"
camada = 2
limite = 10
confirmada = "2026-09-21"

# ---------------------------------------------------------------------------
# Camada 3 — oportunidades para estudante.
#
# Cursos grátis, certificações, licenças e vouchers. São poucas por mês e quase
# nenhuma tem feed próprio. O que está aqui é o que existe mesmo e respondeu a
# 2026-09-21.
#
# Testado e recusado no mesmo dia, escrito para ninguém voltar a tentar:
#   github.blog/tag/student-developer-pack/feed/  responde 200, mas o item mais
#     recente é de 2021-09-01. O GitHub deixou de escrever sobre o Pack.
#   github.blog/tag/github-education/feed/        igual, parado em 2024-11-21.
#   microsoft.com/en-us/education/blog/feed/      vivo, mas escrito para direções
#     de escolas, não para alunos. Traria ruído a cada corrida.
#   landing.jobs/blog/feed/ e itjobs.pt           sem feed (200 sem itens, e 404).
#
# Fica por resolver, e está escrito no README: a página de ofertas do Student
# Pack continua sem maneira de ser vigiada por RSS.

[[fonte]]
nome = "freeCodeCamp"
url = "https://www.freecodecamp.org/news/rss/"
camada = 3
# Publica umas três por dia e a maior parte são tutoriais, que a fase 2 vai
# mandar para fora de âmbito. Aceita-se esse desperdício — na ordem de $0,09
# por mês — porque é aqui que saem os cursos gratuitos, e esses não saem em
# mais lado nenhum que tenha feed.
limite = 10
confirmada = "2026-09-21"

[[fonte]]
nome = "JetBrains Academy"
url = "https://blog.jetbrains.com/education/feed/"
camada = 3
# Duas ou três por mês. Vale pelo que anuncia e pelo que retira: a 2026-08-31
# publicaram o fim do Teacher Pack para bootcamps. É esse tipo de aviso que
# custa dinheiro a quem não o lê a tempo.
limite = 10
confirmada = "2026-09-21"

# ---------------------------------------------------------------------------
# Páginas vigiadas.
#
# A página de ofertas do Student Pack é a fonte que mais interessa à área
# "Grátis para estudante" e não tem feed nenhum — os dois que o GitHub teve
# estão mortos desde 2021 e 2024, e estão listados acima. Não tem entradas nem
# datas: é uma lista que hoje está assim e amanhã está de outra maneira.
#
# Por isso declara `tipo = "pagina"` e é a única fonte do pipeline com memória.
# Guarda um retrato em `dados/paginas.json` e a notícia é a diferença: quem
# entrou, quem saiu, e quem reescreveu a oferta.
#
# Não custa nada em API — é um pedido HTTP e uma comparação de listas. Só gera
# item nos dias em que o GitHub mexer na lista, que são poucos por ano. Custa
# outra coisa: depende do HTML do GitHub, e parte-se no dia em que ele mudar.
# Quando isso acontecer a fonte diz que se partiu em vez de anunciar que
# desapareceram oitenta ofertas — é para isso que serve o MINIMO_DE_PARCEIROS
# no fontes.py.
#
# Fica em camada 3 e não em camada 1, apesar de ser o GitHub a escrever a
# própria página, porque a camada 3 é a das ofertas para estudante e é assim
# que a fase 2 sabe o que pesar: se ele consegue mesmo usar aquilo de graça.

[[fonte]]
nome = "GitHub Student Pack"
tipo = "pagina"
url = "https://education.github.com/pack/offers"
camada = 3
confirmada = "2026-09-21"
