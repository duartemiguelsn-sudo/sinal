# Fontes do Sinal — camada 1 (verdade: sai da boca de quem faz a coisa).
#
# Regra: nenhuma fonte entra aqui sem o URL ter sido testado e ter devolvido
# conteúdo. O campo "confirmada" diz a data em que isso foi feito. Se um feed
# começar a falhar, o pipeline salta-o e regista o erro — não pára a recolha.
#
# Nota sobre a Anthropic: à data de 2026-09-20 não publica RSS. Foram testados
# /rss.xml, /feed.xml, /news/rss.xml e /engineering/rss.xml — todos 404. Até
# existir feed, apanhamos as novidades pelos feeds de releases no GitHub, que
# são igualmente fonte primária.

